
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDta_AAwNpU-9OAWtVgYGhB-GmGaZZFLsI",
  authDomain: "jcl-cricket-scorer.firebaseapp.com",
  projectId: "jcl-cricket-scorer",
  storageBucket: "jcl-cricket-scorer.firebasestorage.app",
  messagingSenderId: "112116011790",
  appId: "1:112116011790:web:d6d2a4ca7416dce53efd5f",
  measurementId: "G-DFJ3V8ZCV8"
};

const $ = id => document.getElementById(id);
const matchId = new URLSearchParams(location.search).get("match");

async function startOverlay() {
  if (!matchId) {
    $("state").textContent = "No Match Code in link. Open the link copied from JCL Scorer.";
    return;
  }

  try {
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    $("state").textContent = "Signing in securely…";
    await signInAnonymously(auth);

    const db = getFirestore(app);

    onSnapshot(doc(db, "Matches", matchId), snap => {
      if (!snap.exists()) {
        $("state").textContent = "Waiting for scorer to publish this match…";
        return;
      }

      const d = snap.data();
      $("bat").textContent = d.BattingTeam || d.TeamA || "Batting";
      $("score").textContent = (d.Runs ?? 0) + "/" + (d.Wickets ?? 0);
      $("bowl").textContent = d.BowlingTeam || d.TeamB || "Bowling";
      $("overs").textContent = (d.Overs || "0.0") + " overs";
      $("match").textContent = (d.Title || "JCL Match") + " • Innings " + (d.InningsNo || 1);
      $("rr").textContent = "RR " + Number(d.RunRate || 0).toFixed(2);
      $("target").textContent = d.Target ? "Target " + d.Target : "";
      $("state").textContent = d.Status === "completed"
        ? "MATCH COMPLETED"
        : "LIVE • Match Code: " + matchId;
    }, err => {
      $("state").textContent = "Cannot read score: " + err.code;
      console.error(err);
    });

  } catch (e) {
    $("state").textContent = "Sign-in/connection failed: " + (e.code || e.message);
    console.error(e);
  }
}

startOverlay();
</script>
