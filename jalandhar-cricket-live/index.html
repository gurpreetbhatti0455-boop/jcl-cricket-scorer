<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jalandhar Cricket Live</title><style>body{font-family:Arial,sans-serif;background:#102b40;color:white;display:grid;place-items:center;min-height:100vh;margin:0;text-align:center}.card{padding:24px;max-width:460px}h1{margin:0 0 12px}p{opacity:.85}a{color:#fff}</style></head><body><div class="card"><h1>🏏 Jalandhar Cricket Live</h1><p>Opening live scoreboard…</p><p id="fallback"></p></div><script>const q=new URLSearchParams(location.search);const match=q.get('match');if(!match){document.getElementById('fallback').innerHTML='Missing match code. Please copy the overlay link from Cricket Scorer by JCL.';}else{const target=new URL('../overlay.html',location.href);target.searchParams.set('match',match);location.replace(target.href);document.getElementById('fallback').innerHTML='If redirect does not happen, <a href="'+target.href+'">open scoreboard</a>.';}</script></body></html>
